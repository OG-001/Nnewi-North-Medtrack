# Dev / self-host stack. The PWA is fully usable on its own (offline-first);
# the api service is the NestJS sync hub that reconciles devices (Phase 3).
# Run from the repo root:  docker compose -f infra/docker-compose.yml up --build
services:
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    ports:
      - "8080:80"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phc
      POSTGRES_PASSWORD: phc_dev_only
      POSTGRES_DB: phc_track
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://phc:phc_dev_only@postgres:5432/phc_track?schema=public
      # Override in a real deployment — never ship this value (NDPA, no secrets in images).
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-chars-long}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 30
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  pgdata:
