# Serves the built PWA. Security headers here are the NDPA §6 application
# baseline (see .claude/rules/ndpa-compliance.md).
#
# In the production stack the reverse proxy puts the API on the SAME origin
# under /api, so the PWA never makes a cross-origin request. That is why
# connect-src can be 'self': no CORS, and a narrower policy than a split origin
# would allow.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Do not advertise the server version.
  server_tokens off;

  # Clickjacking, MIME sniffing, referrer leakage.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # The app needs no camera, microphone or geolocation.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

  # Content Security Policy.
  #   'unsafe-inline' for style-src only: the PWA install splash and a few
  #   component styles are inline. No inline script is allowed.
  #   frame-ancestors repeats X-Frame-Options for browsers that prefer CSP.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # HSTS is set by the TLS-terminating proxy, which is the only component that
  # knows the request arrived over HTTPS.

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # SPA fallback so client-side routes resolve offline-first.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache the service worker, so an update rolls out promptly.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # index.html must revalidate, or a device pins an old asset manifest.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Fingerprinted assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Container-level liveness. The proxy checks this, not a patient-facing route.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
